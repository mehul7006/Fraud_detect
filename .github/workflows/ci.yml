name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest        # ships with Docker, needed by Testcontainers
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify (4+ unit tests, 19 integration tests on real PostgreSQL)
        run: mvn -B -ntp clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  mobile:
    name: Mobile (analyze, test, debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"   # the version the app is built and tested with locally
          channel: stable
          cache: true
      - name: Generate Android shell + merge native code
        run: bash tool/setup_android.sh
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Kotlin unit tests (URL extractor, 4.6)
        working-directory: mobile/android
        run: |
          set +e
          bash ./gradlew :app:testDebugUnitTest --console=plain > ../gradle-test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # surface the end of the log as a public annotation so a failure can be diagnosed
            msg=$(grep -vE '^[[:space:]]*$' ../gradle-test.log | tail -25 | head -c 3500 | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Kotlin tests failed::$msg"
          fi
          exit $code
      - name: Build debug APK (compiles the Kotlin code)
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fraudshield-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
