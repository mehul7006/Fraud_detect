name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest        # ships with Docker, needed by Testcontainers
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify (4+ unit tests, 19 integration tests on real PostgreSQL)
        run: mvn -B -ntp clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  mobile:
    name: Mobile (analyze, test, debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android shell + merge native code
        run: bash tool/setup_android.sh
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build debug APK (compiles the Kotlin code)
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fraudshield-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
