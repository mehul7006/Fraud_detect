# Test-only overrides (merged on top of src/main/resources/application.yml).
# Integration tests register many users from 127.0.0.1 within a minute: rate limits are tested in RateLimitIT instead.
fraudshield:
  ratelimit:
    per-minute: 1000000
    auth-per-minute: 1000000
  # Phase 10 network layers (RDAP, page fetch) are off in the integration tests: they must not need the internet.
  # They are tested with local stub servers (siteintel package).
  urlscan:
    deep:
      enabled: false
