# 11.7 offline explanations (English). One plain sentence per reason code. {brand} = the imitated brand.
# A test fails when a reason code has no text here or in explanations_hi.properties.
lead.brand=This link pretends to be {brand}, but it is not the real {brand} website.
lead.malicious=This link is dangerous - do not open it or enter any details.
lead.suspicious=Be careful with this link - it shows signs of a scam.
BLOCKLIST=This website is on our list of known scam sites.
MALFORMED_URL=The link is broken or written in a strange way, which scammers use to hide where it goes.
NO_HOST=The link has no proper website address.
NO_HTTPS=The site does not use a secure (https) connection.
RAW_IP=The link uses a number instead of a website name, which real companies almost never do.
LOOKALIKE_CHARACTERS=The address uses letters from other alphabets that look like normal letters.
URL_SHORTENER=It is a short link that hides the real website.
RISKY_TLD=The address ends in an ending that is often used for scam sites.
MANY_SUBDOMAINS=The address has many extra parts in front, a common trick to look official.
LONG_DOMAIN=The website name is unusually long.
MANY_HYPHENS=The website name has many dashes, which scam sites often use.
LOOKALIKE_BRAND=The address is spelled to look like a well-known company.
BRAND_IN_SUBDOMAIN=A real company name is placed in front of a different website.
BRAND_IN_PATH=A company name appears in the link, but the website belongs to someone else.
BAIT_WORDS=The link uses bait words like "KYC", "reward", "verify" or "refund".
APK_DOWNLOAD=The link downloads an app file (APK) from outside the Play Store.
CREDENTIALS_TRICK=The link uses an "@" trick so the real website is hidden.
SAFE_BROWSING=Google has listed this site as dangerous.
ML_MODEL=Our AI model finds that it looks like known scam links.
NEW_DOMAIN=The website was created only a few days ago.
YOUNG_DOMAIN=The website is less than six months old.
CERT_UNTRUSTED=The site's security certificate is not valid.
CERT_MISMATCH=The site's security certificate belongs to a different website.
NEW_CERTIFICATE=The site's security certificate was made only a few days ago.
TOO_MANY_REDIRECTS=The link jumps through many other addresses before it opens.
REDIRECTS_ELSEWHERE=The link secretly takes you to a different website.
HTTPS_DOWNGRADE=The link moves you from a secure page to an insecure one.
PRIVATE_ADDRESS=The link points into a private network, which normal websites never do.
COPIES_BRAND_PAGE=The page copies the look of a well-known company.
COPIES_BRAND_LOGO=The page shows a well-known company's logo on a website that is not theirs.
ASKS_FOR_SECRETS=The page asks for your password, OTP, PIN or card details.
FORM_TO_OTHER_DOMAIN=What you type on the page is sent to a different website.
PASSWORD_OVER_HTTP=The page sends your password without protection.
SCAM_WORDING=The page uses typical scam words like "account blocked" or "you have won".
META_REFRESH_AWAY=The page automatically jumps to another website.
# 13.x apps
FAKE_APP=This app pretends to be {brand} but is not the official {brand} app - remove it.
PERMISSION_NOT_NEEDED=The app asks for access it does not need for what it does.
SIDELOADED=The app was installed from outside the app store, so nobody checked it.
BANKING_TROJAN_PATTERN=It can read your SMS and control your screen - the way banking trojans steal OTPs.
LOAN_APP_DATA_GRAB=This loan app wants your contacts and messages, which fake loan apps use to harass people.
OLD_TARGET_SDK=The app is built for very old Android so it gets permissions without asking.
TRACKERS=The app contains tracking code that collects data about you.
MALWARE_DOMAIN=The app talks to servers known to spread malware.
MANY_AD_DOMAINS=The app talks to many advertising and tracking servers.
AD_ABUSE=The app floods you with ads or pop-ups.
