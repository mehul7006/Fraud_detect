# 11.7 offline explanations (Hindi). Same keys as explanations_en.properties.
lead.brand=यह लिंक {brand} होने का दिखावा करता है, लेकिन यह {brand} की असली वेबसाइट नहीं है।
lead.malicious=यह लिंक खतरनाक है - इसे न खोलें और कोई जानकारी न डालें।
lead.suspicious=इस लिंक से सावधान रहें - इसमें धोखाधड़ी के संकेत हैं।
BLOCKLIST=यह वेबसाइट जानी-मानी धोखाधड़ी वाली साइटों की हमारी सूची में है।
MALFORMED_URL=लिंक टूटा हुआ है या अजीब तरीके से लिखा है, ताकि असली पता छिप जाए।
NO_HOST=इस लिंक में कोई सही वेबसाइट पता नहीं है।
