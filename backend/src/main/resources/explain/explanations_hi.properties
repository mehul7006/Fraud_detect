MANY_HYPHENS=वेबसाइट के नाम में कई डैश (-) हैं, जो धोखेबाज़ साइटें अक्सर रखती हैं।
LOOKALIKE_BRAND=पता किसी जानी-मानी कंपनी जैसा दिखने के लिए लिखा गया है।
BRAND_IN_SUBDOMAIN=किसी असली कंपनी का नाम किसी दूसरी वेबसाइट के आगे लगाया गया है।
