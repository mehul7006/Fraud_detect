NEW_CERTIFICATE=इस साइट का सुरक्षा प्रमाणपत्र कुछ ही दिन पहले बना है।
TOO_MANY_REDIRECTS=खुलने से पहले यह लिंक कई दूसरे पतों से होकर गुज़रता है।
REDIRECTS_ELSEWHERE=यह लिंक चुपके से आपको किसी दूसरी वेबसाइट पर ले जाता है।
HTTPS_DOWNGRADE=यह लिंक आपको सुरक्षित पेज से असुरक्षित पेज पर ले जाता है।
PRIVATE_ADDRESS=यह लिंक किसी निजी नेटवर्क की ओर इशारा करता है, जो सामान्य वेबसाइटें कभी नहीं करतीं।
COPIES_BRAND_PAGE=यह पेज किसी जानी-मानी कंपनी के पेज की नकल करता है।
COPIES_BRAND_LOGO=यह पेज किसी जानी-मानी कंपनी का लोगो ऐसी वेबसाइट पर दिखाता है जो उनकी नहीं है।
ASKS_FOR_SECRETS=यह पेज आपका पासवर्ड, OTP, PIN या कार्ड की जानकारी माँगता है।
FORM_TO_OTHER_DOMAIN=आप पेज पर जो लिखते हैं, वह किसी दूसरी वेबसाइट पर भेजा जाता है।
PASSWORD_OVER_HTTP=यह पेज आपका पासवर्ड बिना सुरक्षा के भेजता है।
SCAM_WORDING=पेज पर "खाता बंद हो जाएगा" या "आपने इनाम जीता" जैसे धोखाधड़ी वाले शब्द हैं।
META_REFRESH_AWAY=यह पेज अपने-आप किसी दूसरी वेबसाइट पर चला जाता है।
# 13.x apps
FAKE_APP=यह ऐप {brand} होने का दिखावा करता है, लेकिन यह {brand} का असली ऐप नहीं है - इसे हटा दें।
PERMISSION_NOT_NEEDED=यह ऐप ऐसी अनुमतियाँ माँगता है जिनकी इसके काम के लिए ज़रूरत नहीं है।
SIDELOADED=यह ऐप ऐप स्टोर के बाहर से इंस्टॉल किया गया है, इसलिए किसी ने इसकी जाँच नहीं की।
BANKING_TROJAN_PATTERN=यह आपके SMS पढ़ सकता है और आपकी स्क्रीन चला सकता है - इसी तरह बैंकिंग ट्रोजन OTP चुराते हैं।
LOAN_APP_DATA_GRAB=यह लोन ऐप आपके कॉन्टैक्ट और मैसेज माँगता है, जिनसे नकली लोन ऐप लोगों को परेशान करते हैं।
OLD_TARGET_SDK=यह ऐप बहुत पुराने Android के लिए बना है, ताकि बिना पूछे अनुमतियाँ मिल जाएँ।
TRACKERS=इस ऐप में ट्रैकिंग कोड है जो आपके बारे में डेटा इकट्ठा करता है।
MALWARE_DOMAIN=यह ऐप उन सर्वरों से जुड़ता है जो मैलवेयर फैलाने के लिए जाने जाते हैं।
MANY_AD_DOMAINS=यह ऐप कई विज्ञापन और ट्रैकिंग सर्वरों से जुड़ता है।
AD_ABUSE=यह ऐप आपको विज्ञापनों या पॉप-अप से परेशान करता है।
