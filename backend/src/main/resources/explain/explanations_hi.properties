RAW_IP=लिंक में वेबसाइट के नाम की जगह नंबर है, जो असली कंपनियाँ लगभग कभी नहीं करतीं।
LOOKALIKE_CHARACTERS=पते में दूसरी भाषाओं के ऐसे अक्षर हैं जो सामान्य अक्षरों जैसे दिखते हैं।
URL_SHORTENER=यह छोटा लिंक है जो असली वेबसाइट को छिपाता है।
RISKY_TLD=पते का अंत ऐसा है जो अक्सर धोखाधड़ी वाली साइटों में होता है।
MANY_SUBDOMAINS=पते के आगे कई अतिरिक्त हिस्से हैं, ताकि यह असली लगे।
