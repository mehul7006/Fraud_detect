# Common settings. Environment specifics live in application-dev.yml / application-prod.yml.
spring:
  profiles:
    default: dev
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
logging:
  pattern:
    level: "%5p [%X{requestId}]"
server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
fraudshield:
  jwt:
    ttl-minutes: 43200
  safebrowsing:
    api-key: ${SAFE_BROWSING_KEY:}
  virustotal:
    enabled: ${VT_ENABLED:false}
    api-key: ${VT_API_KEY:}
  # 6.1 ad-abuse weights (defaults live in AdAbuseProperties; override any of them here)
  adabuse:
    notif-high: 20
    notif-high-weight: 50
    overlay-weight: 25
    accessibility-weight: 30
    sms-weight: 25
    self-launch-high-weight: 45
  admin-email: ${ADMIN_EMAIL:}
