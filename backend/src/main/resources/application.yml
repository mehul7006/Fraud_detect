# Common settings. Environment specifics live in application-dev.yml / application-prod.yml.
spring:
  profiles:
    default: dev
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
logging:
  pattern:
    level: "%5p [%X{requestId}]"
server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
fraudshield:
  jwt:
    ttl-minutes: ${JWT_TTL_MINUTES:15}        # 8.2: short access token; the app renews it with the refresh token
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  safebrowsing:
    api-key: ${SAFE_BROWSING_KEY:}
  virustotal:
    enabled: ${VT_ENABLED:false}
    api-key: ${VT_API_KEY:}
  # 6.1 ad-abuse weights (defaults live in AdAbuseProperties; override any of them here)
  adabuse:
    notif-high: 20
    notif-high-weight: 50
    overlay-weight: 25
    accessibility-weight: 30
    sms-weight: 25
    self-launch-high-weight: 45
  admin-email: ${ADMIN_EMAIL:}
  # 7.3 push alerts (Firebase Cloud Messaging). Empty = off. The file is a secret (service-account JSON).
  push:
    credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
  # 8.3 browser origins allowed to call the API (comma separated). Empty = CORS closed; the Android app needs none.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Phase 10 link check. The whole scan answers within budget-ms; slow layers are left out (10.10).
  # deep = domain age (RDAP), certificate + redirects, the page itself. The server fetches the page WITHOUT the query
  # string, without cookies, never from private/local addresses (SSRF guard). Official / top-100k sites are skipped.
  urlscan:
    budget-ms: ${URLSCAN_BUDGET_MS:3000}
    deep:
      enabled: ${URLSCAN_DEEP:true}
      budget-ms: 2700
      rdap-timeout-ms: 1500
      connect-timeout-ms: 1500
      max-page-bytes: 1048576
  # 11.4 link model (ONNX); empty = rules only. 11.6 explanations: Claude when ANTHROPIC_API_KEY is set, else templates.
  ml:
    model: ${ML_MODEL:classpath:models/url-v1}
  explain:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  # 12.5 signs the VPN blocklist (PKCS#8 PEM private key; the public key is built into the app). Secret file.
  blocklist:
    signing-key-file: ${BLOCKLIST_SIGNING_KEY_FILE:}
  # Phase 16 call guard. Crowd reports: SUSPICIOUS at this trust score (vote weight by account age: <1 day 0.2,
  # <7 days 0.5, older 1.0 -> 5.0 = five trusted users); at most daily-report-limit new votes per user per 24 h.
  calls:
    suspicious-threshold: ${CALLS_SUSPICIOUS_THRESHOLD:5.0}
    daily-report-limit: ${CALLS_DAILY_REPORT_LIMIT:30}
    # 16.3 foreign codes that get a warning (comma separated). +92: DoT advisory 29 Mar 2024.
    risky-country-codes: ${CALLS_RISKY_COUNTRY_CODES:+92}
  # 8.1 rate limiting (per logged-in user, or per IP when not logged in). Over the limit -> 429 + Retry-After.
  ratelimit:
    enabled: true
    per-minute: ${RATE_LIMIT_PER_MINUTE:100}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}   # register/login: slows down password guessing
